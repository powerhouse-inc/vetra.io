packages:
  - '.'

overrides:
  '@codemirror/state': 6.5.2
  '@codemirror/view': 6.36.7
  # Dedupe the wallet-lib dependency graph (privy/rainbow/wagmi pulled in 5 viem
  # + 4 zod copies), which sent Turbopack's dev resolver into an HMR churn loop.
  # viem is all 2.x → force one; zod's 3↔4 major split stays, deduped per-major.
  viem: 2.52.2
  'zod@3': 3.25.76
  'zod@4': 4.4.3

allowBuilds:
  '@apollo/protobufjs': true
  '@datadog/pprof': true
  '@reown/appkit': false
  '@sentry/cli': true
  '@tailwindcss/oxide': true
  bufferutil: false
  core-js-pure: true
  esbuild: true
  keccak: false
  protobufjs: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: false

minimumReleaseAgeExclude:
  - '@powerhousedao/analytics-engine-browser@6.2.2-dev.13'
  - '@powerhousedao/analytics-engine-core@6.2.2-dev.13'
  - '@powerhousedao/reactor-attachments@6.2.2-dev.13'
  - '@powerhousedao/reactor-browser@6.2.2-dev.13'
  - '@powerhousedao/reactor-drive@6.2.2-dev.13'
  - '@powerhousedao/reactor@6.2.2-dev.13'
  - '@powerhousedao/shared@6.2.2-dev.13'
  - '@renown/sdk@6.2.2-dev.13'
  - document-model@6.2.2-dev.13
