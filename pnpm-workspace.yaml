packages:
  - '.'

overrides:
  '@codemirror/state': 6.5.2
  '@codemirror/view': 6.36.7
  # Dedupe the wallet-lib dependency graph (privy/rainbow/wagmi pulled in 5 viem
  # + 4 zod copies), which sent Turbopack's dev resolver into an HMR churn loop.
  # viem is all 2.x → force one; zod's 3↔4 major split stays, deduped per-major.
  viem: 2.52.2
  'zod@3': 3.25.76
  'zod@4': 4.4.3
  # vetra-cloud-package ships against the 6.0.0-dev.244 stack, whose
  # `PHAuthState` is `{}`; it gained `version`/`grants` between 6.2.2-dev.15 and
  # -dev.19. Its generated `VetraCloudEnvironmentPHState` therefore no longer
  # satisfies the `PHBaseState` our `PHDocumentController` expects. Point its
  # `document-model` (which pins `@powerhousedao/shared`) at ours so both
  # compile units agree.
  '@powerhousedao/vetra-cloud-package>document-model': 6.2.2-dev.20

allowBuilds:
  '@apollo/protobufjs': true
  '@datadog/pprof': true
  '@reown/appkit': false
  '@sentry/cli': true
  '@tailwindcss/oxide': true
  bufferutil: false
  core-js-pure: true
  esbuild: true
  keccak: false
  protobufjs: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: false

minimumReleaseAgeExclude:
  - '@powerhousedao/analytics-engine-browser@6.2.2-dev.20'
  - '@powerhousedao/analytics-engine-core@6.2.2-dev.20'
  - '@powerhousedao/reactor-attachments@6.2.2-dev.20'
  - '@powerhousedao/reactor-browser@6.2.2-dev.20'
  - '@powerhousedao/reactor-drive@6.2.2-dev.20'
  - '@powerhousedao/reactor@6.2.2-dev.20'
  - '@powerhousedao/shared@6.2.2-dev.20'
  - '@renown/sdk@6.2.2-dev.20'
  - document-model@6.2.2-dev.20
