# Copied verbatim from the binding licensing API contract
# (vetra-cloud-package: docs/superpowers/specs/2026-10-08-licensing-api-contract.md),
# the vetraPublisher and vetraSubscriptions blocks. Refresh it when the contract changes.
#
# Two additions the contract leaves implicit, so the schema can be built:
# - the artifact types it marks "unchanged", as the backend's publisher-schema.ts declares them;
# - the root fields that mount each namespace (as publisher-schema.ts does).
#
# The vetraReleases block is not in that contract: it is copied verbatim from the backend's
# subgraphs/vetra-licensing/releases-schema.ts (query side only; the console only reads it).

# ---- vetraPublisher (contract) ----

type PublisherApp {
  id: String!
  name: String!
  status: String!
  identityDid: String
}

input PublisherAppLinkInput {
  id: String!
  label: String!
  url: String!
}

input UpdateAppProfileInput {
  appId: String!
  name: String
  tagline: String
  website: String
  description: String
  category: String
  logoRef: String
  coverRef: String
  links: [PublisherAppLinkInput!]
  metrics: [PublisherAppMetricInput!]
}

enum PublisherMetricAggregation {
  SUM
  MAX
  AVG
  COUNT_USERS
}

input PublisherAppMetricInput {
  id: String!
  key: String!
  label: String!
  unit: String
  description: String
  aggregation: PublisherMetricAggregation!
  public: Boolean!
}

type PublisherTemplate {
  id: String!
  name: String
  mode: String! # SHARED | DEDICATED
  sharedEnvironment: String # SHARED only; null = App Environment
  size: String
  baseDomain: String
  packageRegistry: String
  services: [PublisherTemplateService!]!
  packages: [PublisherTemplatePackage!]!
  templateHash: String!
  "Environments currently provisioned from this template (DEDICATED), for the 'affects N' warning."
  environmentCount: Int!
  warmPoolSize: Int!
}

type WarmPool {
  size: Int!
  warming: Int!
  available: Int!
  claimedThisMonth: Int!
  warmHoursThisMonth: Float!
  warmHoursLastMonth: Float!
  estimatePerEnvironmentEur: Float!
}

type PublisherTemplateService { # unchanged
  id: String!
  type: String!
  prefix: String
  artifactName: String
  artifactChannel: String
}
type PublisherTemplatePackage {
  id: String!
  packageName: String
  version: String
} # unchanged
type PublisherTerm {
  id: String!
  kind: String!
  label: String
  templateId: String
  validityDays: Int
  issuers: [String!]! # INVITE_CODE | PUBLISHER_GRANT | ACHRA_SUBSCRIPTION
  status: String! # DRAFT | ACTIVE | RETIRED
  activeLicenses: Int!
}

type PublisherLicense {
  id: String!
  user: String! # DID
  kind: String!
  issuer: String!
  status: String! # ISSUED | ACTIVE | EXPIRED | REVOKED | REPLACED
  start: String
  end: String
  environmentId: String # = stage
  replacedBy: String
}

type PublisherEnvironment {
  environmentId: String!
  user: String!
  licenseId: String!
  rootLicenseId: String!
  label: String
  templateHash: String!
  stoppedAt: String
  deleteAfter: String
}

type PublisherInviteCode {
  code: String!
  kind: String!
  label: String
  active: Boolean!
  expiresAt: String
  maxUses: Int
  redemptions: Int!
  hasAnthropicKey: Boolean!
  llmBudgetUsd: Float
  createdAt: String!
}

type PublisherAllowListEntry {
  user: String!
  addedAt: String!
}

# PublisherAppArtifact / PublisherArtifactVersion / PublisherArtifactChannel unchanged.

input AddTemplateInput {
  appId: String!
  name: String
  mode: String!
}
input SetTemplateDetailsInput {
  appId: String!
  templateId: String!
  name: String
  mode: String
  sharedEnvironment: String
  size: String
  baseDomain: String
  packageRegistry: String
  warmPoolSize: Int
}
input AddTemplateServiceInput {
  appId: String!
  templateId: String!
  type: String!
  prefix: String
  artifactName: String
  artifactChannel: String
}
input AddTemplatePackageInput {
  appId: String!
  templateId: String!
  packageName: String!
  version: String
}
input RemoveTemplateEntryInput {
  appId: String!
  templateId: String!
  id: String!
}

input AddTermInput {
  appId: String!
  kind: String!
  label: String
  templateId: String
  validityDays: Int
  issuers: [String!]
}
input SetTermDetailsInput {
  appId: String!
  termId: String!
  kind: String
  label: String
  templateId: String
  validityDays: Int
  issuers: [String!]
}

input IssueGrantInput {
  appId: String!
  kind: String!
  user: String!
  label: String
}
input ReplaceGrantInput {
  licenseId: String!
  kind: String!
}
input RevokeLicenseInput {
  licenseId: String!
  reason: String
}

input CreateInviteCodeInput {
  appId: String!
  kind: String!
  label: String
  "Omit to generate a random code."
  code: String
  expiresAt: String
  maxUses: Int
  "Write-only; stored encrypted, never returned."
  anthropicKey: String
  llmBudgetUsd: Float
}

type VetraPublisherQueries {
  myApps: [PublisherApp!]!
  templates(appId: String!): [PublisherTemplate!]!
  warmPool(appId: String!, templateId: String!): WarmPool!
  terms(appId: String!): [PublisherTerm!]!
  appArtifacts(appId: String!): [PublisherAppArtifact!]!
  licenses(appId: String!, status: String): [PublisherLicense!]!
  environments(appId: String!): [PublisherEnvironment!]!
  inviteCodes(appId: String!): [PublisherInviteCode!]!
  allowList(appId: String!): [PublisherAllowListEntry!]!
}

type VetraPublisherMutations {
  addTemplate(input: AddTemplateInput!): String! # template id
  setTemplateDetails(input: SetTemplateDetailsInput!): Boolean!
  addTemplateService(input: AddTemplateServiceInput!): Boolean!
  removeTemplateService(input: RemoveTemplateEntryInput!): Boolean!
  addTemplatePackage(input: AddTemplatePackageInput!): Boolean!
  removeTemplatePackage(input: RemoveTemplateEntryInput!): Boolean!
  deleteTemplate(appId: String!, templateId: String!): Boolean!
  addTerm(input: AddTermInput!): String! # term id
  setTermDetails(input: SetTermDetailsInput!): Boolean!
  publishTerm(appId: String!, termId: String!): Boolean!
  retireTerm(appId: String!, termId: String!): Boolean!
  issueGrant(input: IssueGrantInput!): String! # licence id
  replaceGrant(input: ReplaceGrantInput!): String! # new licence id
  revokeLicense(input: RevokeLicenseInput!): Boolean!
  createInviteCode(input: CreateInviteCodeInput!): PublisherInviteCode!
  setInviteCodeActive(appId: String!, code: String!, active: Boolean!): Boolean!
  setInviteCodeAnthropicKey(appId: String!, code: String!, anthropicKey: String): Boolean!
  setInviteCodeLlmBudget(appId: String!, code: String!, llmBudgetUsd: Float): Boolean!
  addToAllowList(appId: String!, user: String!): Boolean!
  removeFromAllowList(appId: String!, user: String!): Boolean!
  updateAppProfile(input: UpdateAppProfileInput!): Boolean!
}

# ---- unchanged artifact types (publisher-schema.ts) ----
type PublisherAppArtifact {
  kind: String!
  name: String!
  versions: [PublisherArtifactVersion!]!
  channels: [PublisherArtifactChannel!]!
}
type PublisherArtifactVersion {
  version: String!
  reference: String!
}
type PublisherArtifactChannel {
  channel: String!
  version: String!
}

# ---- vetraSubscriptions (contract) ----

type InviteCodeCheck {
  valid: Boolean!
  "Null when invalid."
  appId: String
  appName: String
  kind: String
  termLabel: String
  "DEDICATED | SHARED; the redeem page asks for a project name only for DEDICATED."
  mode: String
}

type Subscription {
  licenseId: String!
  appId: String!
  appName: String!
  kind: String!
  termLabel: String
  issuer: String!
  status: String!
  start: String
  end: String
  mode: String! # SHARED | DEDICATED
  environmentId: String
  environmentLabel: String
  "Where 'Open' goes: the environment's primary URL (DEDICATED) or the app URL (SHARED)."
  openUrl: String
  stoppedAt: String
  deleteAfter: String
  "Offboarding/expiry banners, newest relevant first."
  warnings: [SubscriptionWarning!]!
}

type SubscriptionWarning {
  kind: String! # EXPIRING | ENDED_STOP_PENDING | STOPPED_DELETE_PENDING | DELETE_IMMINENT
  at: String! # the moment the warning is about (expiry, stop, deletion)
  message: String!
}

type StudioAccess {
  allowed: Boolean!
  licenseId: String
  expires: String
  hasAttachedKey: Boolean!
  llmBudgetUsd: Float!
}

input RedeemInviteCodeInput {
  code: String!
  "Project name for a DEDICATED environment; ignored for SHARED."
  label: String
  "Replace this licence (same app) instead of starting a new environment."
  upgrades: String
}

type VetraSubscriptionsQueries {
  "Public, unauthenticated; rate-limited by ingress."
  inviteCode(code: String!): InviteCodeCheck!
  mySubscriptions: [Subscription!]!
  studioAccess: StudioAccess!
}

type VetraSubscriptionsMutations {
  redeemInviteCode(input: RedeemInviteCodeInput!): Subscription!
  cancelSubscription(licenseId: String!): Boolean!
  "Writes the caller's studio-licence Claude key into a tenant's secrets (was VetraAccessCodes.applyInviteCodeSecret)."
  applyStudioKey(tenantId: String!, secretNames: [String!]!): Boolean!
}

# ---- vetraReleases (releases-schema.ts, query side) ----

type AppReleaseSettings {
  appId: String!
  "AUTO | GATED"
  policy: String!
  defaultNoticeHours: Int!
}

type AppReleaseCanary {
  environmentId: String!
  "The FUSION version it runs; null before it has one."
  version: String
  "The environment status (READY when healthy); null when its document is gone."
  status: String
}

"One FUSION image: what STAGING and LATEST point at, and what each canary runs."
type AppReleaseCandidate {
  artifactName: String!
  staging: String
  latest: String
  canaries: [AppReleaseCanary!]!
}

type AppRolloutStatusCount {
  "PENDING | APPLYING | SUCCEEDED | REVERTED | RESTORED | FAILED | SUPERSEDED"
  status: String!
  count: Int!
}

type AppRollout {
  id: String!
  artifactName: String!
  version: String!
  "ACTIVE | PAUSED | SUPERSEDED | COMPLETE"
  status: String!
  applyAfter: String!
  "The promoter's DID (lower-cased)."
  promotedBy: String!
  promotedAt: String!
  pausedAt: String
  "Names the environment whose update failed, and why."
  pausedReason: String
  counts: [AppRolloutStatusCount!]!
}

type EnvironmentUpdateRecord {
  id: String!
  fromVersion: String!
  toVersion: String!
  "PENDING | APPLYING | SUCCEEDED | REVERTED | RESTORED | FAILED | SUPERSEDED"
  status: String!
  dueAt: String!
  requestedAt: String
  startedAt: String
  finishedAt: String
  "Why it failed, or why it needs attention while PENDING."
  error: String
  createdAt: String!
}

type OpenEnvironmentUpdate {
  toVersion: String!
  dueAt: String!
  "PENDING | APPLYING"
  status: String!
  canUpdateNow: Boolean!
}

type HolderEnvironmentUpdate {
  "The update waiting or applying; null when the environment is current."
  open: OpenEnvironmentUpdate
  "The last 20 updates, newest first."
  history: [EnvironmentUpdateRecord!]!
}

type PublisherEnvironmentUpdate {
  status: String!
  toVersion: String!
  dueAt: String!
  error: String
}

extend type PublisherEnvironment {
  "The FUSION version the environment runs."
  runningVersion: String
  "Follows STAGING and takes releases first."
  isCanary: Boolean!
  "The newest update that was not superseded."
  update: PublisherEnvironmentUpdate
}

type VetraReleasesQueries {
  releaseSettings(appId: String!): AppReleaseSettings!
  releaseCandidates(appId: String!): [AppReleaseCandidate!]!
  rollouts(appId: String!): [AppRollout!]!
  "The environment's holder, or the owner of its app."
  environmentUpdate(environmentId: String!): HolderEnvironmentUpdate!
}

# ---- roots ----
type Query {
  vetraPublisher: VetraPublisherQueries!
  vetraSubscriptions: VetraSubscriptionsQueries!
  vetraReleases: VetraReleasesQueries!
}
type Mutation {
  vetraPublisher: VetraPublisherMutations!
  vetraSubscriptions: VetraSubscriptionsMutations!
}
